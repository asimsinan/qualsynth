# Golub ALL/AML Leukemia Microarray Dataset Configuration (k=500)

name: "golub_leukemia_k500"
description: "Golub et al. ALL/AML leukemia gene-expression microarray (k=500 prompted/evaluated)"

properties:
  n_samples: 72
  n_features: 7129
  n_features_prompted_evaluated: 500
  n_classes: 2
  imbalance_ratio: 1.88   # 47 ALL / 25 AML in the Golub training+test combined cohort
  minority_class: 1
  minority_class_name: "AML"
  majority_class: 0
  majority_class_name: "ALL"

sensitive_attributes: []

splits:
  train: 0.60
  validation: 0.20
  test: 0.20
  stratify: true
  feature_selection: "fold_safe_select_k_best_f_classif"
  selected_features: 500

seeds: [42, 123, 456]

fairness:
  dpd_threshold: 0.10
  eod_threshold: 0.10
  eo_threshold: 0.10

metrics:
  performance:
    - "f1"
    - "recall"
    - "precision"
    - "roc_auc"
    - "pr_auc"
    - "balanced_accuracy"
    - "mcc"
    - "g_mean"
  fairness: []

notes: |
  - Canonical leukemia microarray benchmark from Golub et al. (Science, 1999).
  - Source: UGR Elvira `.dbc` mirror (https://leo.ugr.es/elvira/DBCRepository/), parsed via the same Elvira parser used for Alon.
  - 72 samples (47 ALL, 25 AML); target encoded so AML (the smaller class) is `target == 1` for compatibility with QualSynth's generation workflow.
  - 7129 original gene-expression features; this exploratory extension uses fold-safe training-only SelectKBest(f_classif) to select 500 prompted/evaluated features per seed as a prompt stress test.
  - The UGR transformed-data page does not expose an explicit redistribution license; archive source URL, hashes, scripts, split metadata, and results unless raw-data redistribution permission is confirmed.
  - Splits are produced by `scripts/prepare_high_dim_extension.py --source golub --dataset-name golub_leukemia_k500 --selected-features 500`.
